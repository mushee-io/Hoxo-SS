[package]
name = "hoxo-perp-clearinghouse"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated Soroban Testnet perp clearinghouse with prefunded insurance and liquidation; not unified margin"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk = "=29.0.1"
[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

hoxo-oracle-adapter = { path = "../oracle-adapter" }
