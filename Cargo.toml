[workspace]
members = ["crates/risk-math", "contracts/risk-engine", "contracts/collateral-vault", "contracts/spot-settlement", "contracts/money-market", "contracts/perp-clearinghouse", "contracts/unified-margin", "contracts/oracle-adapter", "contracts/canonical-risk", "contracts/custody-router"]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
