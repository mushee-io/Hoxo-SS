name: Hoxo SS Testnet verification
on:
  push:
    branches: [main, feat/unified-margin-foundation]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify M1-M8 safety gates
        run: npm run check:readiness

  testnet-horizon:
    name: Live Stellar Testnet (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Stellar Testnet passphrase, latest ledger and freshness
        run: npm run check:testnet

  browser-smoke:
    name: Chromium trading terminal and infrastructure smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser harness
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local terminal browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hoxo-server.log 2>&1 &
          sleep 2
          node --test tests/browser-smoke.test.mjs

  testnet-infrastructure:
    name: Live Stellar Testnet RPC + Horizon + registry
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Testnet contract and asset registry
        run: npm run check:registry
      - name: Verify RPC getNetwork/getHealth/getLatestLedger and Horizon consensus
        run: npm run check:infra

  matching-engine:
    name: M8 signed matching journal and HTTP API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed sandbox command and replay tests
        run: npm run test:matching
      - name: M17 advanced-order signatures, TP/SL triggers, reduce-only and hash-chain replay
        run: npm run test:advanced
      - name: M18 public Testnet payment provenance, signed-journal portfolios and history isolation
        run: npm run test:portfolio
      - name: M19 durable RPC ledger indexer, candidate provenance and REST/SSE safety
        run: npm run test:indexer
      - name: M20 rate, auth-abuse, fail-closed operator and oracle pause controls
        run: npm run test:security
      - name: M21 signed Testnet lifecycle receipt proof and fake-evidence rejection
        run: npm run test:m21
      - name: M21 default unverified deployment/readiness report
        run: npm run m21:readiness
      - name: M22 deterministic economic/oracle fuzz and RPC/journal fault injection
        run: npm run test:m22
      - name: M22 audit readiness remains blocked without external review
        run: |
          npm run m22:readiness
          if npm run m22:readiness -- --require-clearance; then
            echo "ERROR: independent audit gate incorrectly granted permission"
            exit 1
          fi
      - name: M23 guarded beta status, deployment hashes, faucet preflight and no fabricated telemetry
        run: npm run test:m23
      - name: M23 beta must remain blocked without signed evidence and independent audit
        run: |
          npm run m23:readiness
          if npm run m23:readiness -- --require-open; then
            echo 'ERROR: M23 public beta opened without independently verified approval'
            exit 1
          fi
      - name: M24 mainnet no-go governance, independent evidence, risk limits and tabletop drills
        run: npm run test:m24
      - name: M24 must not authorise a mainnet release from repository data
        run: |
          npm run m24:readiness
          if npm run m24:readiness -- --require-go; then
            echo 'ERROR: M24 authorised mainnet without external risk, legal and governance release'
            exit 1
          fi
      - name: M19 default server reports no approved deployments
        run: |
          node --input-type=module -e 'import {createIndexerApi} from "./indexer/api.mjs"; const s=createIndexerApi(); if(!s)process.exit(1); s.close();'
      - name: Verify no executable gateway is enabled
        run: |
          node --input-type=module -e 'import {emptyBook,snapshot} from "./matching/core.mjs"; const book=snapshot(emptyBook(),"xlm-usdc-spot"); if(book.tradingEnabled||book.settleable||book.onchain) process.exit(1);'

  m9-sdk-wallet:
    name: M9 SDK two-wallet signing integration checks (no broadcast)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official Stellar SDK
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify available official SDK methods
        run: |
          node --input-type=module -e 'import {rpc,contract,Keypair,Networks} from "@stellar/stellar-sdk"; if(!rpc.Server||!contract.Client?.from||!contract.basicNodeSigner||!Keypair.fromSecret||!Keypair.fromPublicKey||!Networks.TESTNET)process.exit(1)'
      - name: Verify no-broadcast bilateral authorisation and receipt tests
        run: npm run test:m9-wallet
      - name: M21 official SDK XDR envelope signer and contract call verification
        run: node --test tests/m21-sdk.test.mjs

  rust-contracts:
    name: M6–M16 Soroban contract tests and WASM
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: hoxo-soroban29
      - name: Run M7, M16 and M22 seeded risk invariants and stress tests
        run: cargo test -p hoxo-risk-math --all-targets
      - name: Run M6 token vault contract tests
        run: cargo test -p hoxo-collateral-vault --lib
      - name: Run M7 and M16 read-only Soroban risk preview contract tests
        run: cargo test -p hoxo-risk-gate --lib
      - name: Run M9 atomic spot settlement contract tests
        run: cargo test -p hoxo-spot-settlement --lib
      - name: Run M10–M11 supply, interest, guarded borrow and repayment contract tests
        run: cargo test -p hoxo-money-market --lib
      - name: Run M12–M14 margin, funding, insurance and liquidation tests
        run: cargo test -p hoxo-perp-clearinghouse --lib
      - name: Run M15 single-asset canonical margin and cross-product reservation tests
        run: cargo test -p hoxo-unified-margin --lib
      - uses: stellar/stellar-cli@v28.1.0
      - name: Install official Stellar Soroban WASM target
        run: rustup target add wasm32v1-none
      - name: Build M7-M16 read-only risk analytics WASM
        run: |
          stellar contract build --package hoxo-risk-gate
          test -s target/wasm32v1-none/release/hoxo_risk_gate.wasm
          sha256sum target/wasm32v1-none/release/hoxo_risk_gate.wasm
      - name: Build M9 WASM with official stellar contract build
        run: |
          stellar --version
          stellar contract build --package hoxo-spot-settlement
          test -s target/wasm32v1-none/release/hoxo_spot_settlement.wasm
          sha256sum target/wasm32v1-none/release/hoxo_spot_settlement.wasm
      - name: Build M10–M11 WASM using official Stellar CLI
        run: |
          stellar contract build --package hoxo-money-market
          test -s target/wasm32v1-none/release/hoxo_money_market.wasm
          sha256sum target/wasm32v1-none/release/hoxo_money_market.wasm
      - name: Build M12–M14 Testnet perpetual clearinghouse WASM
        run: |
          stellar contract build --package hoxo-perp-clearinghouse
          test -s target/wasm32v1-none/release/hoxo_perp_clearinghouse.wasm
          sha256sum target/wasm32v1-none/release/hoxo_perp_clearinghouse.wasm
      - name: Build M15 canonical margin WASM with official Stellar CLI
        run: |
          stellar contract build --package hoxo-unified-margin
          test -s target/wasm32v1-none/release/hoxo_unified_margin.wasm
          sha256sum target/wasm32v1-none/release/hoxo_unified_margin.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: hoxo-m16-risk-analytics-wasm-review-only
          path: target/wasm32v1-none/release/hoxo_risk_gate.wasm
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: hoxo-m15-unified-margin-wasm-review-only
          path: target/wasm32v1-none/release/hoxo_unified_margin.wasm
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: hoxo-m12-m14-perp-wasm-review-only
          path: target/wasm32v1-none/release/hoxo_perp_clearinghouse.wasm
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: hoxo-m10-m11-wasm-review-only
          path: target/wasm32v1-none/release/hoxo_money_market.wasm
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: hoxo-m9-wasm-review-only
          path: target/wasm32v1-none/release/hoxo_spot_settlement.wasm
          if-no-files-found: error
          retention-days: 7
