name: Risk engine tests
on:
  push:
    branches: [main, feat/unified-margin-foundation]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  testnet-horizon:
    name: Live Stellar Testnet (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Stellar Testnet passphrase, latest ledger and freshness
        run: npm run check:testnet

  browser-smoke:
    name: M2 Chromium trading terminal smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser harness
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local terminal browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hoxo-server.log 2>&1 &
          sleep 2
          node --test tests/browser-smoke.test.mjs
